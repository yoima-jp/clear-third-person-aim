license = "MIT"

modLoader = "javafml"
loaderVersion = "[1,)"

[[mods]]
modId = "${id}"
displayName = "${name}"
version = "${version}"
authors = "yoima-jp"
description = "Makes your own player model transparent only where it blocks your aim in third person view."
${icon_key} = "assets/clear_third_person_aim/icon.png"

[[mixins]]
config = "clear_third_person_aim.mixins.json"

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft}"
ordering = "NONE"
side = "CLIENT"
